:root{
  --bg:#FFF8F3; --card:#FFFFFF; --ink:#5A4A52; --ink-soft:#B3A3AB;
  --pink:#FFB7C5; --pink-soft:#FFE7EC;
  --mint:#B5EAD7; --lav:#D4C5F9; --peach:#FFD8BE; --sky:#B5D8FF; --yellow:#FFE5A0;
  --warn:#FFCD5C; --danger:#FF9AA2; --good:#9AD8A6;
  --line:#F3E9EC; --shadow:0 10px 30px rgba(200,140,160,.14);
  --r:20px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,#FFE9E4 0%,#FFF3EC 40%,#ECF3FF 100%);
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:24px 12px;
}
.display{font-family:'ZCOOL KuaiLe',system-ui,sans-serif;font-weight:400;}

/* phone frame */
.phone{
  width:430px;max-width:100%;height:880px;max-height:96vh;
  background:var(--bg);border-radius:42px;overflow:hidden;
  box-shadow:0 30px 70px rgba(160,100,130,.22),0 2px 0 rgba(255,255,255,.6) inset;
  position:relative;display:flex;flex-direction:column;
  border:1px solid rgba(255,255,255,.7);
}
@media(max-height:920px){ .phone{border-radius:30px;} }

/* pages */
.page{flex:1;overflow-y:auto;padding:20px 20px 96px;-webkit-overflow-scrolling:touch;}
.page[hidden]{display:none;}

/* topbar */
.topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;}
.topbar-hello{font-size:24px;line-height:1.2;}
.topbar-date{font-size:13px;color:var(--ink-soft);margin-top:2px;}
.topbar-emoji{font-size:30px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.08));}

/* limit card */
.limit-card{
  background:linear-gradient(145deg,#FFFFFF,#FFF6F8);
  border-radius:var(--r);padding:22px 20px;box-shadow:var(--shadow);
  border:1px solid #FFF;
}
.limit-ring{display:flex;justify-content:center;margin-bottom:14px;position:relative;}
#home-ring{width:200px;height:200px;}
.ring-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.ring-spent{font-size:30px;line-height:1;}
.ring-label{font-size:12px;color:var(--ink-soft);margin-top:6px;}
.limit-info{display:flex;gap:14px;justify-content:center;margin-bottom:12px;flex-wrap:wrap;}
.limit-row{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-soft);}
.limit-row b{color:var(--ink);font-size:15px;}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;}

/* tips */
.tip{border-radius:14px;padding:10px 14px;font-size:13px;text-align:center;animation:pop .3s ease;}
.tip-good{background:#EAF7EE;color:#4E9E61;}
.tip-warn{background:#FFF4D6;color:#B58A1E;}
.tip-danger{background:#FFE6E8;color:#D65A66;}
@keyframes pop{from{transform:scale(.9);opacity:0;}to{transform:scale(1);opacity:1;}}

/* section */
.section-title{display:flex;justify-content:space-between;align-items:center;margin:24px 4px 12px;}
.section-title span:first-child{font-size:17px;}
.section-title span:last-child{font-size:13px;color:var(--ink-soft);}

/* bill list */
.bills{display:flex;flex-direction:column;gap:10px;}
.bill{
  background:var(--card);border-radius:16px;padding:13px 15px;display:flex;align-items:center;gap:13px;
  box-shadow:0 4px 14px rgba(200,140,160,.08);cursor:pointer;transition:transform .15s;
}
.bill:active{transform:scale(.97);}
.bill-ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.bill-main{flex:1;min-width:0;}
.bill-name{font-size:15px;}
.bill-note{font-size:12px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.bill-amt{font-size:17px;font-weight:600;white-space:nowrap;}
.bill-time{font-size:11px;color:var(--ink-soft);text-align:right;margin-top:2px;}
.empty{text-align:center;padding:36px 0;color:var(--ink-soft);font-size:14px;}
.empty .emoji{font-size:40px;display:block;margin-bottom:8px;opacity:.6;}

/* bottom tabbar */
.tabbar{
  position:absolute;bottom:0;left:0;right:0;height:78px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-around;padding:0 24px;
}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink-soft);background:none;border:none;cursor:pointer;flex:1;}
.tab.active{color:var(--ink);}
.tab .ic{font-size:22px;}
.fab{
  width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(145deg,var(--pink),#FF9CB0);
  color:#fff;font-size:30px;box-shadow:0 8px 20px rgba(255,140,160,.45);
  display:flex;align-items:center;justify-content:center;
  margin-top:-26px;transition:transform .15s;
}
.fab:active{transform:scale(.9);}

/* sheet (add/edit) */
.sheet{position:absolute;inset:0;background:rgba(90,74,82,.32);z-index:30;display:flex;align-items:flex-end;animation:fade .2s;}
.sheet[hidden]{display:none;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.sheet-card{
  width:100%;max-height:92%;background:var(--bg);border-radius:28px 28px 0 0;
  display:flex;flex-direction:column;animation:slideUp .28s cubic-bezier(.2,.9,.3,1);
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px 8px;}
.sheet-head .t{font-size:20px;}
.sheet-head .close{width:32px;height:32px;border-radius:50%;border:none;background:var(--line);font-size:15px;cursor:pointer;color:var(--ink-soft);}
.sheet-scroll{overflow-y:auto;padding:0 22px;}
.amount-display{
  text-align:center;font-size:42px;padding:14px 0 18px;color:var(--ink);
  letter-spacing:1px;
}
.amount-display .currency{font-size:24px;color:var(--ink-soft);vertical-align:super;}
.cat-label,.field-label{font-size:13px;color:var(--ink-soft);margin-bottom:10px;}
.cats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
.chip{
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:9px 11px;border-radius:16px;background:var(--card);border:2px solid transparent;
  cursor:pointer;min-width:62px;transition:all .15s;font-size:12px;
}
.chip .e{font-size:24px;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;}
.chip.sel{border-color:var(--pink);background:var(--pink-soft);transform:translateY(-2px);}
.chip.add{justify-content:center;font-size:22px;color:var(--ink-soft);}
.note-input{
  width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;
  background:var(--card);color:var(--ink);margin-bottom:16px;font-family:inherit;
}
.note-input:focus{outline:none;border-color:var(--pink);}
.time-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:14px;}
.time-row .label{color:var(--ink-soft);}
.time-input{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px;font-size:15px;margin-bottom:16px;font-family:inherit;}
.time-input[hidden]{display:none;}
.del-btn{width:100%;border:none;background:#FFE6E8;color:#D65A66;border-radius:14px;padding:13px;font-size:15px;cursor:pointer;margin-bottom:12px;font-family:inherit;}
.sheet-bottom{padding:12px 22px 22px;border-top:1px solid var(--line);background:var(--card);}
.save-btn{
  width:100%;border:none;border-radius:16px;padding:15px;font-size:17px;cursor:pointer;
  background:linear-gradient(145deg,var(--pink),#FF9CB0);color:#fff;box-shadow:0 6px 16px rgba(255,140,160,.35);
  font-family:inherit;margin-bottom:14px;transition:transform .15s;
}
.save-btn:active{transform:scale(.97);}
.save-btn:disabled{opacity:.5;}
/* keypad */
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.key{
  border:none;background:var(--bg);border-radius:14px;padding:14px 0;font-size:22px;cursor:pointer;
  color:var(--ink);font-family:inherit;transition:background .1s;
}
.key:active{background:var(--pink-soft);}

/* modal (custom category) */
.modal{position:absolute;inset:0;background:rgba(90,74,82,.4);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .2s;}
.modal[hidden]{display:none;}
.modal-card{width:100%;max-width:360px;background:var(--bg);border-radius:24px;padding:22px;max-height:88%;overflow-y:auto;}
.modal-head{font-size:19px;margin-bottom:16px;text-align:center;}
.cat-name-input{width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 14px;font-size:15px;margin-bottom:16px;font-family:inherit;background:var(--card);}
.cat-name-input:focus{outline:none;border-color:var(--pink);}
.emoji-grid,.color-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px;}
.emoji-opt{aspect-ratio:1;border-radius:12px;border:2px solid transparent;background:var(--card);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.emoji-opt.sel{border-color:var(--pink);background:var(--pink-soft);}
.color-opt{aspect-ratio:1;border-radius:12px;border:2px solid transparent;cursor:pointer;}
.color-opt.sel{border-color:var(--ink);transform:scale(.92);}

/* history */
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:14px;box-shadow:0 3px 10px rgba(200,140,160,.06);}
.seg-btn{flex:1;border:none;background:none;padding:9px 0;border-radius:11px;font-size:14px;cursor:pointer;color:var(--ink-soft);font-family:inherit;}
.seg-btn.active{background:linear-gradient(145deg,var(--pink),#FF9CB0);color:#fff;}
.date-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.date-nav button{width:38px;height:38px;border-radius:50%;border:none;background:var(--card);font-size:16px;cursor:pointer;box-shadow:0 3px 10px rgba(200,140,160,.08);color:var(--ink);}
.date-nav .label{font-size:16px;}
.stat-total{
  background:linear-gradient(145deg,#FFFFFF,#FFF6F8);border-radius:var(--r);padding:18px;text-align:center;
  box-shadow:var(--shadow);border:1px solid #FFF;margin-bottom:16px;
}
.stat-total .num{font-size:34px;}
.stat-total .desc{font-size:13px;color:var(--ink-soft);margin-top:4px;}
.stat-sub{font-size:13px;color:var(--ink-soft);margin-top:6px;}
.chart-card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:16px;}
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center;}
#month-donut{width:150px;height:150px;}
.legend{flex:1;min-width:140px;display:flex;flex-direction:column;gap:9px;}
.legend-row{display:flex;align-items:center;gap:9px;font-size:13px;}
.legend-row .ld{width:11px;height:11px;border-radius:4px;flex-shrink:0;}
.legend-row .ln{flex:1;}
.legend-row .lv{font-weight:600;}
.legend-row .lp{color:var(--ink-soft);font-size:11px;margin-left:6px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.bar-row .bn{width:64px;font-size:13px;display:flex;align-items:center;gap:5px;}
.bar-row .be{font-size:18px;}
.bar-track{flex:1;height:18px;background:var(--line);border-radius:9px;overflow:hidden;}
.bar-fill{height:100%;border-radius:9px;transition:width .5s;}
.bar-row .bv{width:60px;text-align:right;font-size:13px;font-weight:600;}

/* toast */
.toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(90,74,82,.92);color:#fff;padding:16px 22px;border-radius:18px;font-size:15px;z-index:50;animation:pop .25s;text-align:center;max-width:300px;box-shadow:0 10px 30px rgba(0,0,0,.2);}
.toast[hidden]{display:none;}
.toast .big{font-size:28px;display:block;margin-bottom:6px;}
</style>
</head>

<script data-page-node-id="R4919MbS1nQR1VYLIsl9ge" data-pnid-children="dTEiwhpWsnLcajUcnobIFm">
/* ============ CONFIG ============ */
const LIMIT = 20;
const K_BILLS='xr_bills', K_CATS='xr_cats';
const WEEK=['周日','周一','周二','周三','周四','周五','周六'];
const EMOJI_SET=['🍰','🍦','🍫','🍎','🍉','🥗','🍜','🍕','🎂','🍩','🍳','🥛','🍵','☕','🍔','🌭','🌮','🍣','🥟','🍙','🧀','🍯','🌶️','🥨'];
const COLOR_SET=['#FFD8A8','#B5EAD7','#D4C5F9','#FFC4D6','#FFE5A0','#B5D8FF','#FFAB91','#A5D6A7','#CE93D8','#FFCC80','#F48FB1','#80DEEA'];
const DEFAULT_CATS=[
  {id:'breakfast',name:'早餐',icon:'🥐',color:'#FFD8A8'},
  {id:'lunch',name:'中餐',icon:'🍱',color:'#B5EAD7'},
  {id:'dinner',name:'晚餐',icon:'🍝',color:'#D4C5F9'},
  {id:'milktea',name:'奶茶',icon:'🧋',color:'#FFC4D6'},
  {id:'snacks',name:'零食',icon:'🍪',color:'#FFE5A0'},
];

/* ============ STATE ============ */
let categories=[], bills=[];
let page='home';
let editingId=null, amountStr='0', pickedCatId=null, pickedTime=null;
let viewMode='day', viewDate=new Date();
let catDraft={emoji:EMOJI_SET[0],color:COLOR_SET[0]};

/* ============ HELPERS ============ */
const $=id=>document.getElementById(id);
const pad=n=>n<10?'0'+n:''+n;
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const ym=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const todayKey=()=>ymd(new Date());
const money=n=>'¥'+Number(n).toFixed(2);
const fmtAmt=n=>'¥'+(Number(n)%1===0?Number(n):Number(n).toFixed(2));

function load(){
  try{bills=JSON.parse(localStorage.getItem(K_BILLS))||[];}catch(e){bills=[];}
  try{let c=JSON.parse(localStorage.getItem(K_CATS));categories=(c&&c.length)?c:DEFAULT_CATS.slice();}catch(e){categories=DEFAULT_CATS.slice();}
}
function saveBills(){localStorage.setItem(K_BILLS,JSON.stringify(bills));}
function saveCats(){localStorage.setItem(K_CATS,JSON.stringify(categories));}
function catById(id){return categories.find(c=>c.id===id);}
function todayBills(){return bills.filter(b=>b.time.startsWith(todayKey())).sort((a,b)=>a.time<b.time?1:-1);}
function daySpent(key){return bills.filter(b=>b.time.startsWith(key)).reduce((s,b)=>s+b.amount,0);}

function ringSvg(ratio,color){
  const r=88,cx=110,cy=110,C=2*Math.PI*r;
  const off=C*(1-Math.min(ratio,1));
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#F3E9EC" stroke-width="16"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="16"
      stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${off}"
      transform="rotate(-90 ${cx} ${cy})" style="transition:stroke-dashoffset .6s ease,stroke .3s;"/>`;
}
function donutSvg(segs){
  const r=60,cx=75,cy=75,C=2*Math.PI*r;
  let acc=0,html=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#F3E9EC" stroke-width="20"/>`;
  segs.forEach(s=>{
    if(s.f<=0)return;
    const len=s.f*C;
    html+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="20"
      stroke-dasharray="${len} ${C-len}" transform="rotate(${acc*360-90} ${cx} ${cy})" style="transition:stroke-dasharray .5s;"/>`;
    acc+=s.f;
  });
  return html;
}
function fmtTimeDisplay(iso){
  const d=new Date(iso.replace(' ','T'));
  const t=todayKey();
  if(iso.startsWith(t))return '今天 '+pad(d.getHours())+':'+pad(d.getMinutes());
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+pad(d.getHours())+':'+pad(d.getMinutes());
}
function toInputVal(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* ============ RENDER HOME ============ */
function renderHome(){
  const t=todayBills();
  const spent=t.reduce((s,b)=>s+b.amount,0);
  const remain=LIMIT-spent;
  const ratio=spent/LIMIT;
  let color=spent===0?'#D9D2D6':(ratio<0.8?'var(--good)':(ratio<1?'var(--warn)':'var(--danger)'));
  $('home-ring').innerHTML=ringSvg(ratio,color);
  $('home-spent').textContent=spent===0?'0':(spent%1===0?spent:spent.toFixed(2));
  $('home-remain').textContent=money(Math.max(remain,0));
  $('home-date').textContent=new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});
  $('home-count').textContent=t.length?'共'+t.length+'笔':'';
  // tips
  let tip='';
  if(spent===0)tip='<div class="tip tip-good">今天还没花钱，继续保持～</div>';
  else if(ratio<0.8)tip='<div class="tip tip-good">花得不多，棒棒的！剩余 '+money(remain)+'</div>';
  else if(ratio<1)tip='<div class="tip tip-warn">快到限额啦，悠着点花～</div>';
  else tip='<div class="tip tip-danger">今日已超支 '+money(spent-LIMIT)+'，注意控制哦～（仍可记账）</div>';
  $('home-tip-wrap').innerHTML=tip;
  // bills
  if(!t.length){
    $('home-bills').innerHTML='<div class="empty"><span class="emoji">🌾</span>今天还没有账单<br>点下方 ＋ 记一笔吧</div>';
  }else{
    $('home-bills').innerHTML=t.map(b=>{
      const c=catById(b.catId)||{name:'已删',icon:'❓',color:'#EEE'};
      return `<div class="bill" onclick="openEdit('${b.id}')">
        <div class="bill-ic" style="background:${c.color}">${c.icon}</div>
        <div class="bill-main"><div class="bill-name">${c.name}</div><div class="bill-note">${b.note||'没有备注'}</div></div>
        <div><div class="bill-amt">${fmtAmt(b.amount)}</div><div class="bill-time">${fmtTimeDisplay(b.time)}</div></div>
      </div>`;
    }).join('');
  }
}

/* ============ RENDER CATEGORIES (sheet) ============ */
function renderCats(){
  $('cats').innerHTML=categories.map(c=>`
    <div class="chip ${pickedCatId===c.id?'sel':''}" onclick="pickCat('${c.id}')">
      <div class="e" style="background:${c.color}">${c.icon}</div>${c.name}
    </div>`).join('')+`
    <div class="chip add" onclick="openCatModal()"><div class="e" style="background:var(--line)">＋</div>新增</div>`;
}
function pickCat(id){pickedCatId=id;renderCats();}

/* ============ KEYPAD ============ */
function renderKeypad(){
  const keys=['1','2','3','4','5','6','7','8','9','.','0','⌫'];
  $('keypad').innerHTML=keys.map(k=>`<button class="key" onclick="pressKey('${k}')">${k}</button>`).join('');
}
function pressKey(k){
  if(k==='⌫'){amountStr=amountStr.length>1?amountStr.slice(0,-1):'0';}
  else if(k==='.'){if(!amountStr.includes('.'))amountStr+='.';}
  else{
    if(amountStr==='0')amountStr=k;
    else{
      // limit decimals to 2
      if(amountStr.includes('.')&&amountStr.split('.')[1].length>=2)return;
      if(amountStr.length<8)amountStr+=k;
    }
  }
  $('amount-text').textContent=amountStr;
}

/* ============ ADD / EDIT SHEET ============ */
function openAdd(){
  editingId=null;pickedCatId=null;amountStr='0';pickedTime=new Date();
  $('sheet-title').textContent='记一笔';
  $('note-input').value='';
  $('time-input').hidden=true;$('time-display').hidden=false;
  $('del-btn').hidden=true;
  $('amount-text').textContent='0';
  $('save-btn').textContent='保存';
  renderCats();updateTimeDisplay();
  $('sheet-add').hidden=false;
}
function openEdit(id){
  const b=bills.find(x=>x.id===id);if(!b)return;
  editingId=id;pickedCatId=b.catId;
  amountStr=String(b.amount);
  if(!amountStr.includes('.')&&b.amount%1===0)amountStr=String(b.amount);
  pickedTime=new Date(b.time.replace(' ','T'));
  $('sheet-title').textContent='编辑账单';
  $('note-input').value=b.note||'';
  $('time-input').hidden=true;$('time-display').hidden=false;
  $('del-btn').hidden=false;
  $('amount-text').textContent=amountStr;
  $('save-btn').textContent='保存修改';
  renderCats();updateTimeDisplay();
  $('sheet-add').hidden=false;
}
function closeSheet(){$('sheet-add').hidden=true;}
function updateTimeDisplay(){
  $('time-display').textContent=pickedTime.getFullYear()+'年'+(pickedTime.getMonth()+1)+'月'+pickedTime.getDate()+'日 '
    +WEEK[pickedTime.getDay()]+' '+pad(pickedTime.getHours())+':'+pad(pickedTime.getMinutes());
}
function toggleTimeEdit(){
  const inp=$('time-input');
  if(inp.hidden){
    inp.value=toInputVal(pickedTime);
    inp.hidden=false;$('time-display').hidden=true;
    $('time-edit-btn').textContent='完成';
    inp.focus();
  }else{
    if(inp.value){pickedTime=new Date(inp.value);updateTimeDisplay();}
    inp.hidden=true;$('time-display').hidden=false;
    $('time-edit-btn').textContent='修改';
  }
}
function saveBill(){
  const amt=parseFloat(amountStr);
  if(!amt||amt<=0){showToast('先输入金额呀～');return;}
  if(!pickedCatId){showToast('选个分类吧～');return;}
  let tISO;
  const inp=$('time-input');
  if(!inp.hidden&&inp.value){tISO=inp.value;}
  else{tISO=toInputVal(pickedTime);}
  const wasUnder=daySpent(todayKey())<=LIMIT;
  if(editingId){
    const i=bills.findIndex(x=>x.id===editingId);
    bills[i]={...bills[i],catId:pickedCatId,amount:amt,note:$('note-input').value.trim(),time:tISO};
  }else{
    bills.push({id:uid(),catId:pickedCatId,amount:amt,note:$('note-input').value.trim(),time:tISO});
  }
  saveBills();closeSheet();
  // over-limit alert (non-blocking)
  const nowSpent=daySpent(todayKey());
  if(nowSpent>LIMIT&&wasUnder){
    showToast('哎呀，今日已超支 '+money(nowSpent-LIMIT)+'<br>下次注意控制哦～','⚠️');
  }
  renderHome();
}
function deleteBill(){
  if(!editingId)return;
  bills=bills.filter(x=>x.id!==editingId);
  saveBills();closeSheet();renderHome();
}

/* ============ CUSTOM CATEGORY ============ */
function openCatModal(){
  $('cat-name-input').value='';
  catDraft={emoji:EMOJI_SET[0],color:COLOR_SET[0]};
  $('emoji-grid').innerHTML=EMOJI_SET.map((e,i)=>`<div class="emoji-opt ${i===0?'sel':''}" onclick="pickEmoji('${e}',this)">${e}</div>`).join('');
  $('color-grid').innerHTML=COLOR_SET.map((c,i)=>`<div class="color-opt ${i===0?'sel':''}" style="background:${c}" onclick="pickColor('${c}',this)"></div>`).join('');
  $('modal-cat').hidden=false;
}
function closeCatModal(){$('modal-cat').hidden=true;}
function pickEmoji(e,el){catDraft.emoji=e;document.querySelectorAll('.emoji-opt').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');}
function pickColor(c,el){catDraft.color=c;document.querySelectorAll('.color-opt').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');}
function addCustomCat(){
  const name=$('cat-name-input').value.trim();
  if(!name){showToast('给分类起个名字～');return;}
  if(categories.some(c=>c.name===name)){showToast('已经有这个分类啦');return;}
  categories.push({id:'c'+uid(),name,icon:catDraft.emoji,color:catDraft.color});
  saveCats();closeCatModal();
  pickedCatId=categories[categories.length-1].id;
  renderCats();
}

/* ============ TOAST ============ */
let toastTimer=null;
function showToast(msg,emoji){
  clearTimeout(toastTimer);
  $('toast').innerHTML=(emoji?`<span class="big">${emoji}</span>`:'')+msg;
  $('toast').hidden=false;
  toastTimer=setTimeout(()=>$('toast').hidden=true,2200);
}

/* ============ HISTORY ============ */
function shiftDate(d){
  const nd=new Date(viewDate);
  if(viewMode==='day')nd.setDate(nd.getDate()+d);
  else if(viewMode==='month')nd.setMonth(nd.getMonth()+d);
  else nd.setFullYear(nd.getFullYear()+d);
  if(nd>new Date())return;
  viewDate=nd;renderHistory();
}
function renderHistory(){
  // label
  let label='';
  if(viewMode==='day')label=(viewDate.getMonth()+1)+'月'+viewDate.getDate()+'日 '+WEEK[viewDate.getDay()];
  else if(viewMode==='month')label=viewDate.getFullYear()+'年'+(viewDate.getMonth()+1)+'月';
  else label=viewDate.getFullYear()+'年';
  $('date-label').textContent=label;
  $('history-content').innerHTML='';
  if(viewMode==='day')renderDay();
  else if(viewMode==='month')renderMonth();
  else renderYear();
}
function renderDay(){
  const key=ymd(viewDate);
  const list=bills.filter(b=>b.time.startsWith(key)).sort((a,b)=>a.time<b.time?1:-1);
  const total=list.reduce((s,b)=>s+b.amount,0);
  let html=`<div class="stat-total"><div class="num display">${fmtAmt(total)}</div><div class="desc">当日总支出</div>`;
  if(key===todayKey()){
    const r=LIMIT-total;
    html+=`<div class="stat-sub">${r>=0?'今日剩余 '+money(r):'今日超支 '+money(-r)}</div>`;
  }else{
    html+=`<div class="stat-sub">${total>LIMIT?'超限额 '+money(total-LIMIT):'未超限额'}</div>`;
  }
  html+=`</div>`;
  if(!list.length){
    html+=`<div class="empty"><span class="emoji">🌙</span>这一天没有账单</div>`;
  }else{
    html+=`<div class="bills">`+list.map(b=>{
      const c=catById(b.catId)||{name:'已删',icon:'❓',color:'#EEE'};
      return `<div class="bill" onclick="openEdit('${b.id}')">
        <div class="bill-ic" style="background:${c.color}">${c.icon}</div>
        <div class="bill-main"><div class="bill-name">${c.name}</div><div class="bill-note">${b.note||'没有备注'}</div></div>
        <div><div class="bill-amt">${fmtAmt(b.amount)}</div><div class="bill-time">${fmtTimeDisplay(b.time)}</div></div>
      </div>`;
    }).join('')+`</div>`;
  }
  $('history-content').innerHTML=html;
}
function renderMonth(){
  const key=ym(viewDate);
  const list=bills.filter(b=>b.time.startsWith(key));
  const total=list.reduce((s,b)=>s+b.amount,0);
  // by category
  const byCat={};
  list.forEach(b=>{byCat[b.catId]=(byCat[b.catId]||0)+b.amount;});
  const arr=Object.entries(byCat).map(([id,a])=>({cat:catById(id)||{name:'已删',icon:'❓',color:'#CCC'},a})).sort((x,y)=>y.a-x.a);
  const days=new Date(viewDate.getFullYear(),viewDate.getMonth()+1,0).getDate();
  let html=`<div class="stat-total"><div class="num display">${fmtAmt(total)}</div><div class="desc">当月总支出 · ${days}天</div>
    <div class="stat-sub">日均 ${fmtAmt(total/days)} · ${total>LIMIT*days?'超支':'正常'}</div></div>`;
  if(arr.length){
    html+=`<div class="chart-card"><div class="donut-wrap">
      <svg viewBox="0 0 150 150" id="month-donut">${donutSvg(arr.map(x=>({f:x.a/total,color:x.cat.color})))}</svg>
      <div class="legend">`+arr.map(x=>`
        <div class="legend-row"><span class="ld" style="background:${x.cat.color}"></span>
        <span class="ln">${x.cat.icon} ${x.cat.name}</span>
        <span class="lv">${fmtAmt(x.a)}</span><span class="lp">${(x.a/total*100).toFixed(0)}%</span></div>`).join('')+`
      </div></div></div>`;
    // daily bars
    html+=`<div class="chart-card"><div class="field-label" style="margin-bottom:14px;">每日支出</div>`;
    const maxDay=Math.max(...Array.from({length:days},(_,i)=>daySpent(viewDate.getFullYear()+'-'+pad(viewDate.getMonth()+1)+'-'+pad(i+1))),0.01);
    for(let i=1;i<=days;i++){
      const dk=viewDate.getFullYear()+'-'+pad(viewDate.getMonth()+1)+'-'+pad(i);
      const dv=daySpent(dk);
      if(dv<=0)continue;
      html+=`<div class="bar-row"><div class="bn">${i}日</div>
        <div class="bar-track"><div class="bar-fill" style="width:${dv/maxDay*100}%;background:${dv>LIMIT?'var(--danger)':'var(--pink)'}"></div></div>
        <div class="bv">${fmtAmt(dv)}</div></div>`;
    }
    html+=`</div>`;
  }else{
    html+=`<div class="empty"><span class="emoji">☁️</span>这个月还没有账单</div>`;
  }
  $('history-content').innerHTML=html;
}
function renderYear(){
  const key=String(viewDate.getFullYear());
  const list=bills.filter(b=>b.time.startsWith(key));
  const total=list.reduce((s,b)=>s+b.amount,0);
  const byCat={};
  list.forEach(b=>{byCat[b.catId]=(byCat[b.catId]||0)+b.amount;});
  const arr=Object.entries(byCat).map(([id,a])=>({cat:catById(id)||{name:'已删',icon:'❓',color:'#CCC'},a})).sort((x,y)=>y.a-x.a);
  const maxA=arr.length?arr[0].a:0.01;
  let html=`<div class="stat-total"><div class="num display">${fmtAmt(total)}</div><div class="desc">${viewDate.getFullYear()}年总支出</div>
    <div class="stat-sub">${arr.length}个分类 · 共${list.length}笔</div></div>`;
  if(arr.length){
    html+=`<div class="chart-card"><div class="field-label" style="margin-bottom:14px;">分类开销汇总</div>`;
    html+=arr.map(x=>`
      <div class="bar-row"><div class="bn"><span class="be">${x.cat.icon}</span>${x.cat.name}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${x.a/maxA*100}%;background:${x.cat.color}"></div></div>
        <div class="bv">${fmtAmt(x.a)}</div></div>`).join('');
    html+=`</div>`;
    // monthly summary
    html+=`<div class="chart-card"><div class="field-label" style="margin-bottom:14px;">月度支出</div>`;
    const monthTotals=[];
    for(let m=1;m<=12;m++){
      const mk=viewDate.getFullYear()+'-'+pad(m);
      const mv=bills.filter(b=>b.time.startsWith(mk)).reduce((s,b)=>s+b.amount,0);
      if(mv>0)monthTotals.push({m,mv});
    }
    const maxM=monthTotals.length?Math.max(...monthTotals.map(x=>x.mv)):0.01;
    if(monthTotals.length){
      html+=monthTotals.map(x=>`
        <div class="bar-row"><div class="bn">${x.m}月</div>
        <div class="bar-track"><div class="bar-fill" style="width:${x.mv/maxM*100}%;background:var(--lav)"></div></div>
        <div class="bv">${fmtAmt(x.mv)}</div></div>`).join('');
    }else{
      html+=`<div class="empty" style="padding:20px 0;">这一年还没有账单</div>`;
    }
    html+=`</div>`;
  }else{
    html+=`<div class="empty"><span class="emoji">🗓️</span>这一年还没有账单</div>`;
  }
  $('history-content').innerHTML=html;
}

/* ============ NAV ============ */
function goPage(p){
  page=p;
  $('page-home').hidden=p!=='home';
  $('page-history').hidden=p!=='history';
  $('tab-home').classList.toggle('active',p==='home');
  $('tab-history').classList.toggle('active',p==='history');
  if(p==='home')renderHome();
  if(p==='history')renderHistory();
  window.scrollTo(0,0);
}

/* ============ EVENTS ============ */
$('fab-add').onclick=openAdd;
$('tab-home').onclick=()=>goPage('home');
$('tab-history').onclick=()=>goPage('history');
$('sheet-close').onclick=closeSheet;
$('save-btn').onclick=saveBill;
$('del-btn').onclick=deleteBill;
$('time-edit-btn').onclick=toggleTimeEdit;
$('cat-save-btn').onclick=addCustomCat;
$('prev-btn').onclick=()=>shiftDate(-1);
$('next-btn').onclick=()=>shiftDate(1);
document.querySelectorAll('.seg-btn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.seg-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');viewMode=b.dataset.v;renderHistory();
});
// close sheets on backdrop
$('sheet-add').addEventListener('click',e=>{if(e.target.id==='sheet-add')closeSheet();});
$('modal-cat').addEventListener('click',e=>{if(e.target.id==='modal-cat')closeCatModal();});

/* ============ INIT ============ */
load();
renderKeypad();
renderHome();
</script>
</body>
</html>
